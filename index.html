<!doctype html><html lang="ar" dir="rtl"><head><style>body:not(.app-open)>header,body:not(.app-open)>nav,body:not(.app-open)>main{display:none}#loginroot{padding:16px}@media print{body:not(.app-open)>*{display:none!important}}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AWTAR STAFF PRO</title><style>:root{--g:#17382d;--p:#e8efea;--bg:#f4f6f4;--mut:#6d8276}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;color:#203b30}header{background:var(--g);color:white;padding:30px 16px 20px}header h1{margin:0;color:#e7cba3;font-size:27px}header p{margin:5px 0 22px;color:#c4d4cb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#2b4d40;border-radius:13px;padding:15px 12px}.stat small,.metric small{display:block;color:#d5e1d9;font-size:13px}.stat strong,.metric strong{display:block;font-size:22px;margin-top:8px;overflow-wrap:anywhere}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 12px}.tabs button{padding:14px 2px;font-size:15px}.tabs .active,button.primary{background:var(--g);color:#fff}button{border:0;border-radius:11px;background:var(--p);color:var(--g);padding:12px 14px;font-size:15px;cursor:pointer}button.danger{background:#a33439;color:#fff}button:disabled{opacity:.45}.wrap{padding:0 12px 60px;max-width:800px;margin:auto}.panel{background:white;border:1px solid #dce5dd;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 1px 3px #00000009}h2{font-size:22px;margin:4px 0 17px}h3{font-size:18px;margin:12px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.metric{background:#eff3ef;padding:15px;border-radius:12px}.metric small{color:var(--mut)}.metric strong{font-size:20px}.big{background:#eff3ef;text-align:center;padding:20px;border-radius:12px;margin:16px 0}.big strong{display:block;font-size:30px} </style><style>.statement-sheet{color:#18372b;background:white;padding:8px 0;font-size:14px}.statement-head{text-align:center;border-bottom:3px solid #17382d;padding-bottom:15px;margin-bottom:15px}.statement-head h2{font-size:22px;margin:0 0 8px}.statement-head h1{font-size:24px;margin:14px 0 0}.statement-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.statement-table{border-collapse:collapse;width:100%;font-size:14px}.statement-table td,.statement-table th{border:1px solid #cddbd1;padding:11px 8px;text-align:right}.statement-table td:last-child{white-space:nowrap}.statement-total{background:#edf3ee;border:1px solid #c9dccc;border-radius:10px;text-align:center;padding:17px;margin:18px 0;font-size:18px}.statement-note{background:#fff7e6;padding:13px;border-radius:9px;line-height:1.8}@media print{body.printing-statement header,body.printing-statement nav,body.printing-statement main{display:none!important}body.printing-statement .overlay{display:block!important;position:static!important;background:white!important;padding:0!important}body.printing-statement .modal{display:block!important;max-height:none!important;max-width:none!important;width:100%!important;overflow:visible!important;padding:0!important}body.printing-statement .no-print{display:none!important}body.printing-statement .statement-sheet{display:block!important}body.printing-statement{background:white!important}}</style></head><body><header><h1>AWTAR STAFF PRO</h1><p>إدارة موظفي مطعم وكافيه أوتار</p><div class="grid" id="summary"></div></header><nav class="tabs" id="tabs"></nav><main class="wrap" id="main"></main><div id="modalroot"></div><script>
const KEY='awtar_staff_pro_v4';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{workers:[],ops:[],trash:[]}}catch(e){db={workers:[],ops:[],trash:[]}};db.workers ||= [];db.ops ||= [];db.trash ||= [];db.config ||= {departments:['المطبخ','الصالة','الكافيه','الإدارة'],fields:[],business:'مطعم وكافيه أوتار'};let tab='workers',selected=null,period=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');const $=id=>document.getElementById(id),fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US')+' د.ع',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر حفظ البيانات، يرجى تنزيل نسخة احتياطية')}};const eligible=w=>{let first=period+'-01',last=period+'-'+String(new Date(+period.slice(0,4),+period.slice(5),0).getDate()).padStart(2,'0');return (!w.start||w.start<=last)&&(!w.endDate||w.endDate>=first)&&(!(!w.endDate&&w.active===false))};const monthOps=(id)=>db.ops.filter(o=>o.worker===id&&o.date.slice(0,7)===period);function calc(w){let ops=monthOps(w.id),sum=t=>ops.filter(o=>o.type===t).reduce((a,o)=>a+(Number(o.amount)||0),0),year=Number(period.slice(0,4)),month=Number(period.slice(5,7)),days=new Date(year,month,0).getDate(),base=Number(w.salary)||0,first=period+'-01',last=period+'-'+String(days).padStart(2,'0'),from=w.start&&w.start>first?w.start:first,to=w.endDate&&w.endDate<last?w.endDate:last,eligibleDays=from<=to?Math.max(0,(Date.UTC(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10))-Date.UTC(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10)))/86400000+1):0,earned=Math.round(base*eligibleDays/30),advance=sum('advance'),safri=sum('safri'),deductions=sum('deduct'),absenceDays=ops.filter(o=>o.type==='absence').reduce((a,o)=>a+(Number(o.days)||0),0),absence=ops.filter(o=>o.type==='absence').reduce((a,o)=>a+(o.manual?Number(o.amount)||0:base/30*(Number(o.days)||0)),0),deduct=deductions+absence,bonus=sum('bonus'),paid=sum('paid');return{earned,eligibleDays,monthDays:days,absenceDays,advance,safri,deduct,deductions,absence,bonus,paid,remaining:earned+bonus-advance-safri-deduct-paid,ops}}function card(label,value){return `<div class="metric"><small>${label}</small><strong>${fmt(value)}</strong></div>`}function render(){let active=db.workers.filter(w=>w.active!==false),tot=active.map(calc);$('summary').innerHTML=`<div class="stat"><small>العمال النشطون</small><strong>${active.length}</strong></div><div class="stat"><small>الرواتب الأساسية</small><strong>${fmt(active.reduce((a,w)=>a+Number(w.salary),0))}</strong></div><div class="stat"><small>السلف لهذا الشهر</small><strong>${fmt(tot.reduce((a,c)=>a+c.advance,0))}</strong></div><div class="stat"><small>الخصومات لهذا الشهر</small><strong>${fmt(tot.reduce((a,c)=>a+c.deductions,0))}</strong></div><div class="stat"><small>الغياب لهذا الشهر</small><strong>${fmt(tot.reduce((a,c)=>a+c.absence,0))}</strong></div>`;$('tabs').innerHTML=[['workers','العمال'],['salaries','الرواتب'],['log','السجل'],['settings','الإعدادات'],['backup','النسخ الاحتياطي'],['ai','مساعد ChatGPT']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${n}</button>`).join('');let html='';if(tab==='workers')html=selected?workerView():workersView();if(tab==='salaries')html=salariesView();if(tab==='log')html=logView();if(tab==='ai')html=aiView();if(tab==='settings')html=settingsView();if(tab==='backup')html=backupView();$('main').innerHTML=html}function go(t){tab=t;selected=null;render();scrollTo(0,0)}function workersView(){let ws=db.workers.filter(w=>w.active!==false);return `<section class="panel"><div class="between"><h2>سجل العمال</h2><button class="primary" onclick="editWorker()">+ إضافة عامل</button></div><input placeholder="بحث باسم العامل..." id="search" oninput="filterWorkers()"><div id="workerlist">${workerList(ws)}</div></section><section class="panel"><h3>العمال المنتهية خدماتهم</h3>${db.workers.filter(w=>w.active===false).map(w=>`<div class="item between"><div><strong>${esc(w.name)}</strong><div class="muted">تاريخ الإنهاء: ${esc(dateDMY(w.endDate))}</div></div><button onclick="selected='${w.id}';render()">فتح الملف</button></div>`).join('')||'<div class="muted">لا يوجد</div>'}</section>`}function workerList(ws){return ws.length?ws.map(w=>`<div class="item between"><div><strong>${esc(w.name)}</strong><div class="muted">${esc(w.job||'عامل')} · راتب شهري ${fmt(w.salary)}</div></div><button onclick="selected='${w.id}';render();scrollTo(0,0)">فتح الحساب ←</button></div>`).join(''):'<div class="empty">لا يوجد عمال. أضف أول عامل.</div>'}function filterWorkers(){$('workerlist').innerHTML=workerList(db.workers.filter(w=>w.active!==false&&w.name.includes($('search').value)))}function dateDMY(s){if(!s)return 'غير محدد';let m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:s}function dateFields(key,val){let a=(val||new Date().toLocaleDateString('en-CA')).split('-');return `<div class="dategrid"><input aria-label="اليوم" name="${key}Day" type="number" min="1" max="31" placeholder="يوم" value="${+a[2]}"><input aria-label="الشهر" name="${key}Month" type="number" min="1" max="12" placeholder="شهر" value="${+a[1]}"><input aria-label="السنة" name="${key}Year" type="number" min="2000" max="2100" placeholder="سنة" value="${+a[0]}"></div><button type="button" onclick="openNumericCalendar(this,'${key}')">📅 اختيار من التقويم (شهر رقمي)</button><small>اليوم / الشهر / السنة</small>`}
let awtarCalState=null;
function openNumericCalendar(btn,key){let form=btn.closest('form'),y=Number(form.elements[key+'Year'].value)||new Date().getFullYear(),m=Number(form.elements[key+'Month'].value)||new Date().getMonth()+1,d=Number(form.elements[key+'Day'].value)||1;awtarCalState={form,key,y,m,d};drawNumericCalendar()}
function shiftNumericCalendar(n){let c=awtarCalState,t=new Date(c.y,c.m-1+n,1);c.y=t.getFullYear();c.m=t.getMonth()+1;drawNumericCalendar()}
function chooseNumericDay(d){let c=awtarCalState;c.d=d;c.form.elements[c.key+'Day'].value=d;c.form.elements[c.key+'Month'].value=c.m;c.form.elements[c.key+'Year'].value=c.y;closeNumericCalendar()}
function closeNumericCalendar(){document.getElementById('awtarCalendar')?.remove();awtarCalState=null}
function drawNumericCalendar(){let c=awtarCalState;if(!c)return;let first=new Date(c.y,c.m-1,1).getDay(),days=new Date(c.y,c.m,0).getDate(),names=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];let cells=names.map(n=>`<span>${n}</span>`).join('')+Array.from({length:first},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>`<button type="button" class="${i+1===c.d?'chosen':''}" onclick="chooseNumericDay(${i+1})">${i+1}</button>`).join('');document.getElementById('awtarCalendar')?.remove();let el=document.createElement('div');el.id='awtarCalendar';el.className='awtar-cal';el.onclick=e=>{if(e.target===el)closeNumericCalendar()};el.innerHTML=`<div class="awtar-cal-box"><div class="awtar-cal-head"><button type="button" onclick="shiftNumericCalendar(-1)">❮</button><strong>${String(c.m).padStart(2,'0')}/${c.y}</strong><button type="button" onclick="shiftNumericCalendar(1)">❯</button></div><div class="awtar-cal-grid">${cells}</div><div class="awtar-cal-actions"><button type="button" onclick="closeNumericCalendar()">إلغاء</button><button type="button" onclick="chooseNumericDay(${Math.min(c.d,days)})">تأكيد</button></div></div>`;document.body.appendChild(el)}
function readDate(f,key){let y=+f.elements[key+'Year'].value,m=+f.elements[key+'Month'].value,d=+f.elements[key+'Day'].value;if(y<2000||y>2100||m<1||m>12||d<1||d>new Date(y,m,0).getDate())return null;return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function format12(t){if(!t)return 'غير محدد';let a=t.split(':'),h=+a[0];return `${h%12||12}:${a[1]} ${h>=12?'م':'ص'}`}function time12Fields(key,val){let [hh,mm]=(val||'09:00').split(':'),h=+hh;return `<div class="dategrid"><select name="${key}Hour">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${h%12===(i+1)%12?'selected':''}>${i+1}</option>`).join('')}</select><select name="${key}Minute">${['00','15','30','45'].concat([mm]).filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option value="${v}" ${mm===v?'selected':''}>${v}</option>`).join('')}</select><select name="${key}Period"><option value="AM" ${h<12?'selected':''}>صباحاً</option><option value="PM" ${h>=12?'selected':''}>مساءً</option></select></div>`}function time24(f,k){let h=+f.elements[k+'Hour'].value%12;if(f.elements[k+'Period'].value==='PM')h+=12;return String(h).padStart(2,'0')+':'+f.elements[k+'Minute'].value}
function workerView(){let w=db.workers.find(x=>x.id===selected);if(!w){selected=null;return workersView()}let c=calc(w);return `<section class="panel"><div class="between no-print"><button onclick="selected=null;render()">→ العمال</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="editWorker('${w.id}')">تعديل بيانات العامل</button><button class="primary" onclick="openDocuments('${w.id}')">📷 مستمسكات العامل</button></div></div><h2>${esc(w.name)}</h2>${w.documents?.workerPhoto?`<img src="${w.documents.workerPhoto}" alt="صورة العامل" style="width:105px;height:105px;object-fit:cover;border-radius:50%;border:3px solid #d6e3d9;margin:8px 0">`:''}${w.active===false?`<p class="muted">منتهية خدماته بتاريخ ${esc(dateDMY(w.endDate))} · ${esc(w.endReason||'')}</p>`:''}<div class="muted">${esc(w.job||'عامل')} | ${esc(w.department||'')} | ${esc(w.phone||'')} | المباشرة: ${esc(dateDMY(w.start))}</div><div class="big"><small>المتبقي لهذا الشهر (${period.slice(5,7)+"/"+period.slice(0,4)})</small><strong>${fmt(c.remaining)}</strong></div><p class="muted">الراتب الشهري الأساسي: ${fmt(w.salary)} · أيام الاستحقاق: ${c.eligibleDays} من ${c.monthDays} يوم · قيمة اليوم: ${fmt(Number(w.salary)/30)} · أيام الغياب المسجلة: ${c.absenceDays}</p><div class="grid">${card('راتب المدة المستحق',c.earned)}${card('السلف',c.advance)}${card('السفري (أكل)',c.safri)}${card('الخصومات',c.deductions)}${card('الغياب',c.absence)}${card('المكافآت',c.bonus)}${card('المدفوع فعلياً',c.paid)}</div><div class="no-print"><h3>ملف العامل · أوقات الدوام والعقد</h3><div class="item"><strong>أوقات الدوام</strong><div class="muted">${format12(w.shiftStart)} — ${format12(w.shiftEnd)} | ${esc(w.workDays||"أيام الدوام غير محددة")}</div><div class="muted">${esc(w.shiftNote||"")}</div><button onclick="editSchedule('${w.id}')">تعديل أوقات الدوام</button> <button onclick="showContract('${w.id}')">عرض / طباعة عقد العمل</button></div><h3>مستمسكات العامل</h3><div class="item"><p class="muted">صورة العامل الشخصية والبطاقة الموحدة (أمام وخلف) وبطاقة السكن (أمام وخلف)، مع المعاينة والطباعة.</p><button onclick="openDocuments('${w.id}')">📷 فتح / رفع / طباعة المستمسكات</button></div><h3>بيانات إضافية</h3>${db.config.fields.map(f=>`<div class='item'><strong>${esc(f.label)}:</strong> ${esc((w.custom||{})[f.id]||'—')}</div>`).join('')}<h3>الإجراءات المالية</h3><div class="actions"><button onclick="openOp('advance')">+ سلفة</button><button onclick="openOp('safri')">+ سفري (أكل)</button><button onclick="openOp('absence')">+ غياب</button><button onclick="openOp('deduct')">+ خصم</button><button onclick="openOp('bonus')">+ مكافأة</button><button onclick="openOp('paid')">+ صرف راتب</button></div><h3>المستندات والمتابعة</h3><button style="width:100%" onclick="previewStatement()">كشف / وصل الراتب · عرض / مشاركة / طباعة</button><h3>حالة العامل</h3><button onclick="${w.active===false?'reactivateWorker':'terminateWorker'}('${w.id}')">${w.active===false?'إعادة التفعيل':'إنهاء الخدمات بتاريخ'}</button> <button class="danger" onclick="trashWorker('${w.id}')">نقل العامل إلى سلة المحذوفات</button></div><h3>عمليات ${period}</h3>${c.ops.length?c.ops.slice().reverse().map(opRow).join(''):'<div class="empty">لا توجد عمليات لهذا الشهر</div>'}</section>`}const names={advance:'سلفة',safri:'سفري (أكل)',absence:'غياب',deduct:'خصم',bonus:'مكافأة',paid:'صرف راتب'};function opRow(o){return `<div class="item between"><div><span class="pill">${names[o.type]}</span> <strong>${fmt(o.amount)}</strong><div class="muted">${esc(dateDMY(o.date))} · ${o.type==='safri'?esc(o.meal||'وجبة')+' · ':''}${esc(o.note||'بدون ملاحظة')}${o.type==='absence'?' · '+o.days+' يوم':''}</div></div><div class="no-print"><button class="smallbtn" onclick="openOp('${o.type}','${o.id}')">تعديل</button> <button class="danger smallbtn" onclick="removeOp('${o.id}')">حذف</button></div></div>`}function monthPicker(){return `<label>دورة الرواتب</label><input type="month" value="${period}" onchange="if(this.value){period=this.value;render()}">`}function salariesView(){return `<section class="panel"><h2>الرواتب الشهرية</h2>${monthPicker()}<div class="big"><small>إجمالي المتبقي للصرف</small><strong>${fmt(db.workers.filter(eligible).reduce((a,w)=>a+calc(w).remaining,0))}</strong></div>${db.workers.filter(eligible).map(w=>`<div class="item between"><div><strong>${esc(w.name)}</strong><div class="muted">${fmt(calc(w).remaining)}</div></div><button onclick="selected='${w.id}';tab='workers';render()">التفاصيل</button></div>`).join('')}<button class="primary" onclick="previewPayroll()">كشف حساب الرواتب · عرض / طباعة</button></section>`}function previewPayroll(){let ws=db.workers.filter(eligible),keys=['earned','advance','safri','absence','deductions','bonus','paid','remaining'],tot=Object.fromEntries(keys.map(k=>[k,0]));let rows=ws.map((w,i)=>{let c=calc(w);keys.forEach(k=>tot[k]+=c[k]||0);return `<tr><td>${i+1}</td><td>${esc(w.name)}</td>${keys.map(k=>`<td>${Math.round(c[k]||0).toLocaleString('en-US')}</td>`).join('')}</tr>`}).join('');let html=`<div class="statement-sheet" id="statementSheet" dir="rtl"><div class="statement-head"><h2>${esc(db.config.business||'مطعم وكافيه أوتار')}</h2><h1>كشف حساب الرواتب الشهري</h1><p>الدورة: ${esc(period)} | عدد العمال: ${ws.length}</p></div><div style="overflow-x:auto"><table class="statement-table"><thead><tr><th>#</th><th>العامل</th><th>راتب المدة المستحق</th><th>السلف</th><th>السفري</th><th>الغياب</th><th>الخصومات</th><th>المكافآت</th><th>المصروف</th><th>المتبقي</th></tr></thead><tbody>${rows||'<tr><td colspan="10">لا يوجد عمال</td></tr>'}<tr><th colspan="2">المجموع</th>${keys.map(k=>`<th>${Math.round(tot[k]||0).toLocaleString('en-US')}</th>`).join('')}</tr></tbody></table></div><p class="statement-note">جميع المبالغ بالدينار العراقي. كشف للمراجعة وليس إيصال استلام رواتب.</p></div>`;modal(`<div class="between no-print"><h2>معاينة كشف الرواتب</h2><button onclick="closeModal()">إغلاق ×</button></div>${html}<div class="actions no-print"><button class="primary" onclick="printStatement()">طباعة / حفظ PDF</button><button onclick="sharePayroll()">مشاركة الكشف</button></div>`)}
async function sharePayroll(){let content=`${db.config.business||'مطعم وكافيه أوتار'}\nكشف رواتب ${period}\n`+db.workers.filter(eligible).map(w=>`${w.name}: ${fmt(calc(w).remaining)}`).join('\n');if(navigator.share){try{await navigator.share({title:'كشف الرواتب',text:content});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(content);alert('تم نسخ الكشف، افتح واتساب والصقه.')}catch(e){prompt('انسخ كشف الرواتب:',content)}}
function logView(){let ops=db.ops.filter(o=>o.date.slice(0,7)===period);return `<section class="panel"><h2>سجل العمليات والمراجعة</h2>${monthPicker()}${ops.length?ops.slice().reverse().map(o=>`<div class="item"><strong>${esc(db.workers.find(w=>w.id===o.worker)?.name||'عامل محذوف')}</strong> · ${names[o.type]}<div>${fmt(o.amount)} · ${esc(dateDMY(o.date))}${o.type==='safri'?' · '+esc(o.meal||'وجبة'):''}</div><div class="muted">${esc(o.note||'بدون ملاحظات')}</div></div>`).join(''):'<div class="empty">لا توجد عمليات</div>'}<button onclick="window.print()">طباعة السجل</button></section>`}function settingsView(){return `<section class="panel"><h2>لوحة تحكم المدير</h2><p class='muted'>إضافة أقسام وحقول جديدة لملف العامل وتعديل اسم المنشأة.</p><label>اسم المنشأة</label><input id='businessName' value='${esc(db.config.business)}'><button onclick='saveBusiness()'>حفظ الاسم</button><h3>الأقسام</h3>${db.config.departments.map((d,i)=>`<div class='item between'><span>${esc(d)}</span><button onclick='renameDepartment(${i})'>تعديل</button><button onclick='removeDepartment(${i})'>حذف</button></div>`).join('')}<button class='primary' onclick='addDepartment()'>+ إضافة قسم</button><h3>حقول إضافية للعامل</h3>${db.config.fields.map((f,i)=>`<div class='item between'><span>${esc(f.label)} (${f.type==='date'?'تاريخ':f.type==='number'?'رقم':'نص'})</span><button onclick='renameField(${i})'>تعديل</button><button onclick='removeField(${i})'>حذف</button></div>`).join('')}<button class='primary' onclick='addField()'>+ إضافة حقل</button><hr><h2>البيانات والنسخ الاحتياطي</h2><p class="muted">البيانات محفوظة محلياً على هذا المتصفح. احتفظ بنسخة احتياطية بانتظام.</p><button class="primary" onclick="backup()">تنزيل نسخة احتياطية JSON</button><label>استيراد نسخة احتياطية</label><input type="file" accept="application/json,.json" onchange="restore(event)"></section><section class="panel"><h2>سلة محذوفات العمال (${db.trash.length})</h2>${db.trash.map(w=>`<div class="item between">${esc(w.name)} <button onclick="restoreWorker('${w.id}')">استرجاع</button></div>`).join('')||'<div class="empty">السلة فارغة</div>'}</section>`}function backupView(){return `<section class="panel"><h2>النسخ الاحتياطي</h2><p>نزّل جميع بيانات العمال والرواتب والسلف والغيابات والسفريات والمستمسكات والإعدادات بملف JSON، واحفظه في تطبيق الملفات أو iCloud Drive.</p><button class="primary" onclick="backup()">تنزيل نسخة احتياطية</button><hr><h2>استرجاع نسخة احتياطية</h2><p class="muted">تنبيه: الاسترجاع يستبدل البيانات الحالية. نزّل نسخة احتياطية أولاً.</p><input type="file" accept="application/json,.json" onchange="restore(event)"><h3>معلومات الحفظ</h3><p class="muted">البيانات محفوظة داخل متصفح هذا الجهاز فقط، ولا تتزامن تلقائياً بين الأجهزة.</p></section>`}function modal(html){$('modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modalroot').innerHTML=''}function editWorker(id){let w=db.workers.find(x=>x.id===id)||{};modal(`<div class="between"><h2>${id?'تعديل بيانات العامل':'إضافة عامل'}</h2><button onclick="closeModal()">إغلاق ×</button></div><form onsubmit="saveWorker(event,'${id||''}')"><label>اسم العامل *</label><input name="name" required value="${esc(w.name||'')}"><label>الوظيفة</label><input name="job" value="${esc(w.job||'')}"><label>القسم</label><select name="department"><option value="">غير محدد</option>${db.config.departments.map(d=>`<option value="${esc(d)}" ${w.department===d?'selected':''}>${esc(d)}</option>`).join('')}</select>${db.config.fields.map(f=>`<label>${esc(f.label)}</label><input name="custom_${f.id}" type="${f.type}" value="${esc((w.custom||{})[f.id]||'')}">`).join('')}<label>رقم الهاتف</label><input name="phone" value="${esc(w.phone||'')}"><label>تاريخ المباشرة</label>${dateFields("start",w.start)}<label>الراتب الشهري بالدينار *</label><input name="salary" type="number" min="0" required value="${w.salary||''}"><p class="muted">الراتب شهري؛ يُحسب تلقائياً حسب تاريخ المباشرة وعدد أيام الشهر (28 أو 29 أو 30 أو 31).</p><p><button class="primary" type="submit">حفظ العامل</button></p></form>`)}function saveWorker(e,id){e.preventDefault();let f=e.target,w=db.workers.find(x=>x.id===id);if(!w){w={id:crypto.randomUUID(),active:true};db.workers.push(w)}let start=readDate(f,'start');if(!start){alert('تاريخ المباشرة غير صحيح');return}for(let k of ['name','job','phone','salary','department'])w[k]=f.elements[k].value;w.start=start;w.salary=Number(w.salary);if(!Number.isFinite(w.salary)||w.salary<0){alert('الراتب الشهري غير صحيح');return}w.salaryMode='monthly';w.custom ||= {};db.config.fields.forEach(field=>w.custom[field.id]=f.elements['custom_'+field.id]?.value||'');selected=w.id;save();closeModal();render()}function openOp(type,id){let w=db.workers.find(x=>x.id===selected),o=db.ops.find(x=>x.id===id)||{},d=(o.date||new Date().toLocaleDateString('en-CA')).split('-'),days=o.days||1,absenceMonthDays=new Date(+d[0],+d[1],0).getDate(),auto=Number(w.salary)/30*days;modal(`<div class="between"><h2>${id?'تعديل':'تسجيل'} ${names[type]} - ${esc(w.name)}</h2><button onclick="closeModal()">إغلاق ×</button></div><form onsubmit="saveOp(event,'${type}','${id||''}')"><label>التاريخ</label><div class="dategrid"><input name="day" type="number" min="1" max="31" value="${+d[2]}"><input name="month" type="number" min="1" max="12" value="${+d[1]}" oninput="updateAbsencePreview(this.form)"><input name="year" type="number" min="2020" max="2100" value="${+d[0]}" oninput="updateAbsencePreview(this.form)"></div>${type==='absence'?`<label>عدد أيام الغياب</label><input name="days" type="number" min="0.5" step="0.5" value="${days}" oninput="updateAbsencePreview(this.form)"><div class="muted"><span id="absenceHint">أساس احتساب أجر اليوم: 30 يوم | الخصم التلقائي: ${fmt(auto)}</span></div><label><input id="manual" type="checkbox" style="width:auto" onchange="updateAbsencePreview(this.form)" ${o.manual?'checked':''}> تعديل قيمة الخصم يدوياً</label>`:''}${type==='safri'?`<label>اسم الوجبة / الأكل *</label><input name="meal" required maxlength="120" value="${esc(o.meal||'')}" placeholder="مثلاً: وجبة غداء">`:''}<label>${type==='paid'?'المبلغ المصروف':type==='absence'?'قيمة خصم الغياب بالدينار':'المبلغ بالدينار *'}</label><input id="amount" name="amount" type="number" min="0" required value="${o.amount??(type==='absence'?Math.round(auto):type==='paid'?Math.max(0,calc(w).remaining):'')}"><label>الملاحظات / السبب</label><textarea name="note">${esc(o.note||'')}</textarea>${type==='paid'?`<p class="muted">المتبقي قبل الصرف: ${fmt(calc(w).remaining+(id?Number(o.amount):0))}. يمكن تسجيل صرف جزئي.</p>`:''}<p><button class="primary" type="submit">${type==='paid'?'تأكيد الصرف':'حفظ العملية'}</button></p></form>`)}function updateAbsencePreview(f){if(!f||!f.elements.days)return;let y=+f.elements.year.value,m=+f.elements.month.value,days=new Date(y,m,0).getDate(),count=+f.elements.days.value,w=db.workers.find(x=>x.id===selected);if(!w||!days||!Number.isFinite(count))return;let amount=Math.round(Number(w.salary)/30*count),hint=document.getElementById('absenceHint');if(hint)hint.textContent='أساس احتساب أجر اليوم: 30 يوم | الخصم التلقائي: '+fmt(amount);if(!f.querySelector('#manual')?.checked)f.elements.amount.value=amount}
function saveOp(e,type,id){e.preventDefault();let f=e.target,year=+f.year.value,month=+f.month.value,day=+f.day.value,date=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;if(new Date(date+'T12:00:00').getDate()!==day||new Date(date+'T12:00:00').getMonth()+1!==month){alert('التاريخ غير صحيح');return}let amount=+f.amount.value;if(type==='absence'&&!f.querySelector('#manual').checked){amount=Number(db.workers.find(w=>w.id===selected)?.salary||0)/30*(+f.days.value)}if(type==='absence'&&(!(Number(f.days.value)>0)||Number(f.days.value)>new Date(year,month,0).getDate())){alert('عدد أيام الغياب غير صحيح');return}if(type==='absence'){let w=db.workers.find(x=>x.id===selected),lastDay=new Date(year,month,0).getDate(),first=date.slice(0,7)+'-01',last=date.slice(0,7)+'-'+String(lastDay).padStart(2,'0'),from=w.start&&w.start>first?w.start:first,to=w.endDate&&w.endDate<last?w.endDate:last,eligibleDays=from<=to?(Date.UTC(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10))-Date.UTC(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10)))/86400000+1:0,other=db.ops.filter(x=>x.worker===selected&&x.type==='absence'&&x.id!==id&&x.date.slice(0,7)===date.slice(0,7)).reduce((a,x)=>a+(Number(x.days)||0),0);if(date<from||date>to||other+Number(f.days.value)>eligibleDays){alert('الغياب خارج فترة خدمة العامل أو يتجاوز أيام استحقاقه بالشهر');return}}if(amount<0||!Number.isFinite(amount)){alert('المبلغ غير صحيح');return}let o=db.ops.find(x=>x.id===id);if(!o){o={id:crypto.randomUUID(),worker:selected,type};db.ops.push(o)}Object.assign(o,{date,amount,meal:type==='safri'?f.meal.value.trim():'',note:f.note.value,days:type==='absence'?+f.days.value:0,manual:type==='absence'?f.querySelector('#manual').checked:false});save();closeModal();render()}function removeOp(id){if(confirm('حذف هذه العملية؟')){db.ops=db.ops.filter(o=>o.id!==id);save();render()}}function terminateWorker(id){let w=db.workers.find(x=>x.id===id);if(!w)return;modal(`<h2>إنهاء خدمات ${esc(w.name)}</h2><form onsubmit="saveTermination(event,'${id}')"><label>تاريخ إنهاء الخدمات</label>${dateFields("endDate",w.endDate)}<label>سبب إنهاء الخدمات (اختياري)</label><textarea name="endReason">${esc(w.endReason||'')}</textarea><div class="actions"><button class="primary" type="submit">تأكيد إنهاء الخدمات</button><button type="button" onclick="closeModal()">إلغاء</button></div></form>`)}function saveTermination(e,id){e.preventDefault();let w=db.workers.find(x=>x.id===id),d=readDate(e.target,'endDate');if(!d){alert('تاريخ الإنهاء غير صحيح');return}if(w.start&&d<w.start){alert('تاريخ الإنهاء يسبق المباشرة');return}w.endDate=d;w.endReason=e.target.endReason.value;w.active=false;save();closeModal();render()}function reactivateWorker(id){let w=db.workers.find(x=>x.id===id);if(!w||!confirm('إعادة تفعيل العامل؟ سيعود إلى كشوف الرواتب الجارية.'))return;w.active=true;delete w.endDate;delete w.endReason;save();render()}function trashWorker(id){if(!confirm('نقل العامل إلى سلة المحذوفات؟'))return;let w=db.workers.find(x=>x.id===id);db.trash.push(w);db.workers=db.workers.filter(x=>x.id!==id);selected=null;save();render()}function restoreWorker(id){let w=db.trash.find(x=>x.id===id);db.workers.push(w);db.trash=db.trash.filter(x=>x.id!==id);save();render()}function statement(){let w=db.workers.find(x=>x.id===selected),c=calc(w);return `مطعم وكافيه أوتار\nكشف حساب العامل: ${w.name}\nالشهر: ${period}\nالراتب: ${fmt(c.earned)}\nالسلف: ${fmt(c.advance)}\nالسفري (أكل): ${fmt(c.safri)}\nالخصومات: ${fmt(c.deductions)}\nالغياب: ${fmt(c.absence)}\nالمكافآت: ${fmt(c.bonus)}\nالمدفوع: ${fmt(c.paid)}\nالمتبقي: ${fmt(c.remaining)}\n\nالعمليات:\n${c.ops.map(o=>`${o.date} - ${names[o.type]} - ${o.meal||''} - ${fmt(o.amount)} - ${o.note||''}`).join('\n')}`}function previewStatement(){let w=db.workers.find(x=>x.id===selected),c=calc(w),paidOps=c.ops.filter(o=>o.type==='paid'),last=paidOps.at(-1),receipt=paidOps.length>0;let lines=[['راتب مدة العمل',c.earned],['المكافآت',c.bonus],['السلف',c.advance],['السفري (أكل)',c.saf function saveDocument(e,id,k){let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('اختر صورة');return}let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1300,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let w=db.workers.find(x=>x.id===id);w.documents ||= {};let old=w.documents[k];w.documents[k]=c.toDataURL('image/jpeg',.72);try{localStorage.setItem(KEY,JSON.stringify(db));openDocuments(id)}catch(err){if(old)w.documents[k]=old;else delete w.documents[k];alert('مساحة حفظ Safari غير كافية. احفظ نسخة احتياطية واحذف الصور غير اللازمة.')}};im.src=reader.result};reader.readAsDataURL(file)}

async function passwordHash(password,salt){let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:210000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,'0')).join('')}
async function makePassword(password){let salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));return {salt,hash:await passwordHash(password,salt)}}
async function submitLogin(e){e.preventDefault();let f=e.target,b=f.querySelector('button');b.disabled=true;try{let p=f.elements.password.value;if(!authRecord){if(p.length<6||p!==f.elements.confirm.value)throw Error('اكتب 6 أحرف أو أرقام على الأقل وتأكد من تطابق الكلمتين');let record=await makePassword(p);localStorage.setItem(AUTH_KEY,JSON.stringify(record));authRecord=record}else if(await passwordHash(p,authRecord.salt)!==authRecord.hash)throw Error('كلمة المرور غير صحيحة');unlocked=true;$('loginroot').remove();document.body.classList.add('app-open');render()}catch(err){$('loginError').textContent=crypto.subtle?err.message:'افتح البرنامج عبر HTTPS حتى يعمل قفل كلمة المرور';b.disabled=false}}
function lockApp(){unlocked=false;selected=null;showLogin()}
function changePassword(){modal(`<h2>تغيير كلمة المرور</h2><form onsubmit="savePasswordChange(event)"><label>كلمة المرور الحالية</label><input name="current" type="password" required autocomplete="current-password"><label>كلمة المرور الجديدة</label><input name="next" type="password" minlength="6" required autocomplete="new-password"><label>تأكيد الجديدة</label><input name="confirm" type="password" required autocomplete="new-password"><p id="passwordError" role="alert"></p><button class="primary">حفظ</button> <button type="button" onclick="closeModal()">إلغاء</button></form>`)}
async function savePasswordChange(e){e.preventDefault();let f=e.target;try{if(await passwordHash(f.current.value,authRecord.salt)!==authRecord.hash)throw Error('كلمة المرور الحالية غير صحيحة');if(f.next.value.length<6||f.next.value!==f.confirm.value)throw Error('الجديدة لا تقل عن 6 أحرف أو أرقام ويجب تطابق التأكيد');let record=await makePassword(f.next.value);localStorage.setItem(AUTH_KEY,JSON.stringify(record));authRecord=record;closeModal();alert('تم تغيير كلمة المرور')}catch(err){$('passwordError').textContent=err.message}}
function normalizePhone(value){let s=String(value||'').replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[\s()+.\-]/g,'');if(s.startsWith('00'))s=s.slice(2);if(/^07\d{9}$/.test(s))s='964'+s.slice(1);if(/^7\d{9}$/.test(s))s='964'+s;return /^[1-9]\d{7,14}$/.test(s)?s:''}
let messageDraft='',messageQueue=[],openedPhones=new Set();
function whatsappMessagesView(){return `<section class="panel"><h2>توجيه للكادر عبر واتساب</h2><p>اكتب رسالة واحدة لجميع أرقام الموظفين المسجلة. جهّز القائمة ثم افتح واتساب لكل رقم واضغط إرسال داخله.</p><label>نص التوجيه</label><textarea id="staffMessage" rows="5" oninput="messageDraft=this.value">${esc(messageDraft)}</textarea><label><input id="includeFormer" type="checkbox" checked style="width:auto"> تضمين الموظفين المنتهية خدماتهم أيضاً</label><p class="muted">الرقم العراقي: 07xxxxxxxxx أو +9647xxxxxxxxx. للأرقام الدولية أضف رمز البلد.</p><button class="primary" onclick="prepareMessages()">تجهيز الرسالة لجميع الأرقام</button><div id="messageRecipients"></div><p class="muted">فتح المحادثة لا يعني إرسال الرسالة أو تسليمها. الإرسال التلقائي للجميع يحتاج ربطاً رسمياً بخدمة واتساب للأعمال.</p></section>`}
function prepareMessages(){messageDraft=$('staffMessage').value.trim();if(!messageDraft){alert('اكتب الرسالة أولاً');return}let seen=new Set(),invalid=[],duplicates=0;messageQueue=[];openedPhones.clear();db.workers.filter(w=>$('includeFormer').checked||w.active!==false).forEach(w=>{let phone=normalizePhone(w.phone);if(!phone){invalid.push(w.name);return}if(seen.has(phone)){duplicates++;return}seen.add(phone);messageQueue.push({name:w.name,phone,text:messageDraft})});$('messageRecipients').innerHTML=`<h3>معاينة الرسالة</h3><p style="white-space:pre-wrap">${esc(messageDraft)}</p><p>${messageQueue.length} رقم صالح · ${duplicates} رقم مكرر تم تجاوزه</p>${invalid.length?`<p role="alert">رقم ناقص أو غير صالح: ${invalid.map(esc).join('، ')}</p>`:''}${messageQueue.map((w,i)=>`<div class="item between"><span>${esc(w.name)}<br><bdi>+${w.phone}</bdi></span><button id="wa_${i}" onclick="openStaffMessage(${i})">فتح واتساب</button></div>`).join('')||'<p>لا توجد أرقام صالحة.</p>'}`}
function openStaffMessage(i){let w=messageQueue[i];if(!w)return;window.open('https://wa.me/'+w.phone+'?text='+encodeURIComponent(w.text),'_blank','noopener');openedPhones.add(w.phone);$('wa_'+i).textContent='فُتحت المحادثة — فتح مجدداً'}
let phoneSmsQueue=[],phoneSmsText='',smsCandidates=[],smsPicked=new Set(),smsIncludeFormer=false;
function smsCandidateData(){let seen=new Set(),valid=[],invalid=[],duplicates=0;db.workers.filter(w=>smsIncludeFormer||w.active!==false).forEach(w=>{let p=normalizePhone(w.phone);if(!p){invalid.push(w.name);return}if(seen.has(p)){duplicates++;return}seen.add(p);valid.push({name:w.name,phone:'+'+p})});return {valid,invalid,duplicates}}
function smsPickerView(){let r=smsCandidateData();smsCandidates=r.valid;smsPicked=new Set([...smsPicked].filter(p=>smsCandidates.some(w=>w.phone===p)));return `<h3>اختر المستلمين</h3><p>المحددون: <strong id="smsPickedCount">${smsPicked.size}</strong> من ${smsCandidates.length}</p><button type="button" onclick="pickAllSms(true)">تحديد الكل</button> <button type="button" onclick="pickAllSms(false)">إلغاء التحديد</button><div>${smsCandidates.map((w,i)=>`<label class="item" style="display:flex;gap:12px;align-items:center"><input class="sms-recipient" type="checkbox" style="width:auto" data-sms-index="${i}" onchange="toggleSmsRecipient(${i},this.checked)" ${smsPicked.has(w.phone)?'checked':''}><span>${esc(w.name)}<br><bdi>${esc(w.phone)}</bdi></span></label>`).join('')||'<p>لا توجد أرقام صالحة. أضف رقم الهاتف في ملف العامل.</p>'}</div><p class="muted">${r.duplicates} رقم مكرر مستبعد.${r.invalid.length?' أرقام ناقصة أو غير صالحة: '+r.invalid.map(esc).join('، '):''}</p>`}
function invalidateSmsPreview(){phoneSmsQueue=[];phoneSmsText='';if($('phoneSmsResults'))$('phoneSmsResults').innerHTML=''}
function toggleSmsRecipient(i,checked){let w=smsCandidates[i];if(!w)return;if(checked)smsPicked.add(w.phone);else smsPicked.delete(w.phone);$('smsPickedCount').textContent=smsPicked.size;invalidateSmsPreview()}
function pickAllSms(checked){smsPicked=new Set(checked?smsCandidates.map(w=>w.phone):[]);$('smsPicker').innerHTML=smsPickerView();invalidateSmsPreview()}
function refreshSmsPicker(checked){smsIncludeFormer=checked;$('smsPicker').innerHTML=smsPickerView();invalidateSmsPreview()}
function messagesView(){return `<section class="panel"><h2>رسائل الكادر — اختيار المستلمين</h2><p>حدد الأشخاص من القائمة، واكتب الرسالة، ثم افتح تطبيق الرسائل للمحددين واضغط إرسال داخله.</p><label><input type="checkbox" id="smsFormer" style="width:auto" onchange="refreshSmsPicker(this.checked)" ${smsIncludeFormer?'checked':''}> إظهار المنتهية خدماتهم أيضاً</label><div id="smsPicker">${smsPickerView()}</div><label>نص الرسالة</label><textarea id="smsText" rows="5" maxlength="1600" oninput="messageDraft=this.value;invalidateSmsPreview()">${esc(messageDraft)}</textarea><button type="button" class="primary" onclick="preparePhoneSms()">معاينة الرسالة للمحددين</button><div id="phoneSmsResults" role="status" aria-live="polite"></div><p class="muted">لا تحتاج رمز إرسال. الخصم من الباقة يعتمد على شركة الخط ونوع الرسالة؛ تأكد من أنها SMS ومن الخط المختار داخل الرسائل. العربية الطويلة قد تُحسب عدة رسائل. الرسالة الجماعية قد تظهر أرقام المشاركين وردودهم لبعضهم؛ خيار كل عامل وحده متاح. إذا لم ينتقل النص أو جميع الأرقام تلقائياً، انسخ النص وافتح لكل عامل وحده.</p></section><details class="panel"><summary>واتساب اليدوي</summary>${whatsappMessagesView()}</details>`}
function preparePhoneSms(){let text=$('smsText').value.trim();if(!text){alert('اكتب الرسالة أولاً');return}let validNow=new Set(smsCandidateData().valid.map(w=>w.phone));phoneSmsQueue=smsCandidates.filter(w=>smsPicked.has(w.phone)&&validNow.has(w.phone));if(!phoneSmsQueue.length){alert('حدد عاملاً واحداً على الأقل من القائمة');return}phoneSmsText=text;$('phoneSmsResults').innerHTML=`<h3>معاينة قبل الفتح — ${phoneSmsQueue.length} مستلم</h3><p style="white-space:pre-wrap">${esc(text)}</p><button type="button" onclick="copyPhoneSmsText()">نسخ نص الرسالة</button> <button type="button" class="primary" onclick="openPhoneSms(-1)">فتح الرسالة للمحددين</button>${phoneSmsQueue.map((w,i)=>`<div class="item between"><span>${esc(w.name)} — <bdi>${esc(w.phone)}</bdi></span><button type="button" onclick="openPhoneSms(${i})">فتح لهذا العامل فقط</button></div>`).join('')}<p>فتح الرسائل لا يعني الإرسال أو التسليم. اضغط إرسال داخل تطبيق الرسائل بعد مراجعة المستلمين.</p>`;$('phoneSmsResults').scrollIntoView({behavior:'smooth',block:'start'})}
async function copyPhoneSmsText(){try{await navigator.clipboard.writeText(phoneSmsText);alert('تم نسخ النص')}catch(e){prompt('انسخ النص يدوياً',phoneSmsText)}}
function phoneSmsUrl(phones,text,isIos){return 'sms:'+phones.join(',')+(isIos?'&':'?')+'body='+encodeURIComponent(text)}
function openPhoneSms(i){if(!phoneSmsText||!phoneSmsQueue.length)return;let list=i===-1?phoneSmsQueue:[phoneSmsQueue[i]];if(!list[0])return;if(i===-1&&!confirm('فتح رسالة جماعية إلى '+list.length+' رقم؟ قد تظهر الأرقام والردود للمشاركين حسب نوع الرسالة. تأكد من أنها SMS ومن الخط المختار قبل الضغط على إرسال.'))return;let ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);location.href=phoneSmsUrl(list.map(w=>w.phone),phoneSmsText,ios)}

render();

</script></body></html>
